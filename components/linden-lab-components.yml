note: >-
  Linden Lab's embeddable surface predates the modern component era by well over a
  decade and shows it: the Map API is a Leaflet-based JavaScript map you drop into a
  page, documented against Leaflet 1.0.2, with no npm package, no versioned CDN
  build and no published loader URL on the reference page. It is recorded here
  because it is genuinely a client-side embeddable component and it still works —
  https://map.secondlife.com/ returned 200 on 2026-08-25 — not because it is
  current practice.
families:
  - name: Map API
    kind: embeddable JavaScript map
    docs: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Map_API
    reference: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Map_API_Reference
    hosted_surface: https://map.secondlife.com/
    hosted_surface_status: 200
    underlying_library: Leaflet (documentation references Leaflet 1.0.2)
    loader_url: null
    loader_note: >-
      The reference page does not publish a script-tag URL or CDN path for the
      library. Recorded as null rather than guessed — a consumer has to work it out
      from the example pages.
    api:
      globals:
        - signature: SLMap(HTMLElement element)
          description: Creates a new map inside the specified DOM element.
        - signature: gotoSLURL(x Number, y Number, Map lmap)
          description: Pans the map to display the specified inworld location.
      methods:
        - signature: setView(LatLng center, Number zoom)
          description: Centers and zooms the map to the specified location.
