apis:
- name: Second Life Live Data Feeds
  description: >-
    Anonymous, unauthenticated feeds publishing live Second Life grid statistics
    (grid status, total registered accounts, avatars currently inworld) and LindeX
    currency-market data (limit and market buy/sell rate ranges and volumes over
    the last hour, last day and today, plus the best-10-percent offer book). Served
    in three formats — a bespoke two-line key/value text format, plain XML, and
    LLSD XML. Signups update daily, the inworld count every 3 minutes, LindeX every
    15 minutes. The only Second Life API reachable with no credential of any kind.
  humanURL: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Live_Data_Feeds
  baseURL: https://api.secondlife.com/datafeeds
  tags:
  - Statistics
  - Virtual Economy
  - Currency
  - Open Data
  properties:
  - type: Documentation
    url: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Live_Data_Feeds
  - type: Examples
    url: examples/linden-lab-examples.yml
  - type: TermsOfService
    url: https://wiki.secondlife.com/wiki/Linden_Lab_Official:API_Terms_of_Use
- name: Second Life Name to Agent ID API
  description: >-
    Resolves a Second Life username, with an optional last name defaulting to
    "Resident", to the avatar's agent UUID. A JSON POST authenticated with an
    api-key header issued from the account console. Rate limited to 2 requests per
    second, returning 403 on exhaustion. The most modern endpoint on Linden Lab's
    surface and the only one with a JSON error envelope.
  humanURL: https://wiki.secondlife.com/wiki/Name_to_agent_ID_API
  baseURL: https://api.secondlife.com
  tags:
  - Identity
  - Lookup
  properties:
  - type: Documentation
    url: https://wiki.secondlife.com/wiki/Name_to_agent_ID_API
  - type: SignUp
    url: https://accounts.secondlife.com/manage_api_key
  - type: RateLimits
    url: rate-limits/linden-lab-rate-limits.yml
  - type: ErrorCatalog
    url: errors/linden-lab-error-codes.yml
- name: Second Life Registration API
  description: >-
    Registers new Second Life residents from a third-party web page. Capability
    based — credentials are POSTed to a capability-minting endpoint which returns
    per-operation unguessable capability URLs for create_user, check_name,
    add_to_group, get_last_names and get_error_codes. LLSD XML request and response
    bodies, with a published catalog of 59 numeric error codes the API will also
    enumerate for you at runtime. Access is granted by application, reviewed by
    Linden Lab.
  humanURL: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Registration_API
  baseURL: https://cap.secondlife.com
  tags:
  - Registration
  - Identity
  - Onboarding
  properties:
  - type: Documentation
    url: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Registration_API
  - type: APIReference
    url: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Registration_API_Reference
  - type: ErrorCatalog
    url: errors/linden-lab-error-codes.yml
  - type: SourceCode
    url: https://github.com/secondlife/registration-api-examples
  - type: SignUp
    url: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Registration_API_Request_Form
- name: Second Life Map API
  description: >-
    Embeds an interactive map of the Second Life world into a web page. A
    Leaflet-based JavaScript component (SLMap, gotoSLURL, setView) backed by two
    JSONP capability endpoints on cap.secondlife.com that translate between region
    names and grid coordinates. Paired with the SLurl deep-link scheme that opens a
    specific inworld location in the viewer.
  humanURL: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Map_API
  baseURL: https://map.secondlife.com
  tags:
  - Maps
  - Geospatial
  - Embeddable
  properties:
  - type: Documentation
    url: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Map_API_Introduction
  - type: APIReference
    url: https://wiki.secondlife.com/wiki/Linden_Lab_Official:Map_API_Reference
  - type: Components
    url: components/linden-lab-components.yml
- name: Second Life Marketplace Automatic Notification System
  description: >-
    An outbound webhook that forwards information about every sale made on the
    Second Life Marketplace to a merchant-configured external URL. Delivers
    Purchase and Redelivery transaction records carrying currency, gross and fee
    amounts, payer, receiver and merchant UUIDs, transaction and item identifiers,
    validated by an X-ANS-Verify-Hash SHA1 header checked against a
    merchant-specific salt.
  humanURL: https://wiki.secondlife.com/wiki/Direct_Delivery_and_Automatic_Notification_System
  baseURL: https://marketplace.secondlife.com
  tags:
  - Webhooks
  - Marketplace
  - Commerce
  - Notifications
  properties:
  - type: Webhooks
    url: asyncapi/linden-lab-ans-webhooks.yml
  - type: Documentation
    url: https://wiki.secondlife.com/wiki/Direct_Delivery_and_Automatic_Notification_System
