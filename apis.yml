aid: linden-lab
name: Linden Lab
description: >-
  Linden Lab is the San Francisco company that created and has continuously
  operated Second Life since 2003 — the largest and longest-running user-built 3D
  virtual world, with its own economy, land market and L$ currency. Its public API
  surface is small and old, documented in prose on the Second Life wiki rather than
  in any machine-readable contract: anonymous Live Data Feeds publishing grid
  statistics and LindeX currency-market data, an api-key-authenticated username to
  agent-UUID lookup, a capability-based Registration API for creating accounts from
  a third-party site, an embeddable Leaflet-based Map API, and an outbound
  Marketplace webhook. Linden Lab also publishes the Second Life viewer, the LSL
  and SLua scripting documentation, and the LLSD serialization libraries on GitHub.
  It no longer owns Tilia, its former payments subsidiary, which was sold to Thunes
  in 2024.
