deprecation_policy:
  published: false
  detail: >-
    Linden Lab publishes no deprecation policy, no sunset window, and no advance
    notice commitment for its APIs. The API Terms of Use state the opposite
    explicitly: "Linden Lab may amend these API Terms at any time in its sole
    discretion, with or without notice, effective upon posting the amended
    Agreement." No Sunset or Deprecation response header (RFC 8594) was observed
    on any live endpoint probed 2026-08-25.
  source: https://wiki.secondlife.com/wiki/Linden_Lab_Official:API_Terms_of_Use
  rfc8594_headers_observed: false
sla:
  published: false
  detail: >-
    No uptime SLA, no credit schedule and no support-response commitment is
    published for the APIs. Second Life is sold as a consumer subscription; the
    status page reports availability but promises none.
deprecated_operations: []
deprecated_operations_note: >-
  Cannot be derived — Linden Lab publishes no OpenAPI. Two API surfaces named in
  the wiki's own portal are documented as historical rather than current: the
  Media Rendering Plugin System (viewer-internal) and several third-party services
  listed under "Unofficial APIs" (Search API, World API, Picture Service,
  Snapshot API), which Linden Lab neither operates nor supports.
retired_products:
  - name: Tilia
    detail: >-
      Tilia LLC, Linden Lab's payments subsidiary and the operator of the Tilia Pay
      API, was sold to Thunes under an agreement announced 2024-04-23 and has since
      been rebranded to Thunes. tilia.io is therefore NOT a Linden Lab API surface
      and is deliberately excluded from this profile.
    source: https://lindenlab.com/press-release/thunes-announces-agreement-to-acquire-tilia-llc
