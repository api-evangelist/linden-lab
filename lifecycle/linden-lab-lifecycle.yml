versioning:
  scheme: date-and-channel
  detail: >-
    Second Life does not version its web APIs. What is versioned is the platform:
    the viewer ships on named channels (Release, Project, Develop) tagged like
    `Second_Life_Release#3eb594aa-26.2-control`, and the simulator ships on
    rolling RC channels. The APIs themselves carry version markers only inside
    capability names (the Inventory API's "Version-2 identified capabilities",
    FetchInventory2 / FetchInventoryDescendents2), not in a URL path or an
    Accept header. There is no /v1/ anywhere on api.secondlife.com.
  api_version_in_url: false
  api_version_header: null
status_page:
  url: https://status.secondlifegrid.net/
  platform: Atlassian Statuspage
  machine_readable: true
  endpoints:
    - url: https://status.secondlifegrid.net/api/v2/status.json
      status: 200
      returns: overall indicator + description
    - url: https://status.secondlifegrid.net/api/v2/summary.json
      status: 200
      returns: per-component status (secondlife.com, grid, marketplace, ...)
    - url: https://status.secondlifegrid.net/history.rss
      status: 200
      returns: incident history feed
  probed: '2026-08-25'
  observed: '{"status":{"indicator":"none","description":"All Systems Operational"}}'
  note: >-
    The Statuspage v2 JSON API is Atlassian's contract, not Linden Lab's, but it is
    served for Linden Lab's page and is the only machine-readable operational
    signal the company exposes. An agent monitoring Second Life should poll
    /api/v2/summary.json rather than scraping the HTML.
