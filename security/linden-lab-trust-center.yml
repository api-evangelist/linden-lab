detail: >-
  Linden Lab publishes no trust center and names no security or privacy
  certification — no SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP claim exists on
  either lindenlab.com or secondlife.com. The legal footer carries only Terms of
  Service, Privacy Policy, an Intellectual Property Infringement Notification
  Policy, a DMCA form at https://dmca.lindenlab.com/ and Content Guidelines.
  Worth stating explicitly because search results still associate PCI-scoped
  payments compliance with "Linden Lab": that work sat inside Tilia LLC, which was
  sold to Thunes in 2024 and rebranded. Any current certification in that lineage
  belongs to Thunes, not to Linden Lab.
