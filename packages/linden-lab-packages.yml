note: >-
  Linden Lab publishes no client SDK for its HTTP APIs (Live Data Feeds,
  get_agent_id, Registration API). What it does publish first-party are the
  serialization and tooling libraries the Second Life platform itself is built on
  — LLSD codecs, the LEAP viewer plugin protocol library, the autobuild package
  manager — plus the official editor extension. Every entry below was resolved to
  a real registry record; none is a wrapper around the documented web APIs.
packages:
