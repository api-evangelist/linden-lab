    url: https://pypi.org/project/llsd-asgi/
    install: pip install llsd-asgi
    official: true
    version: 0.2.2
    published: '2024-03-16'
    repository: https://github.com/secondlife/llsd-asgi
    description: Drop-in LLSD content negotiation middleware for ASGI applications.
  - language: python
    registry: pypi
    name: autobuild
    url: https://pypi.org/project/autobuild/
    install: pip install autobuild
    official: true
    version: 3.10.2
