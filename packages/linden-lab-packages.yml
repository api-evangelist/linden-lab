    registry: pypi
    name: llsd
    url: https://pypi.org/project/llsd/
    install: pip install llsd
    official: true
    version: 1.2.4
    published: '2024-04-02'
    repository: https://github.com/secondlife/python-llsd
    description: >-
      Linden Lab Structured Data (LLSD) serialization library — the wire format
      the Second Life Inventory API, the homepage.xml and lindex.xml data feeds,
      and the viewer capability system all use.
  - language: python
    registry: pypi
    name: llbase
    url: https://pypi.org/project/llbase/
    install: pip install llbase
    official: true
    version: 1.3.1
    published: '2023-04-03'
    repository: https://github.com/secondlife/python-llbase
    description: Base Linden Lab Python modules (the repo itself is labelled "Vintage python utility modules").
  - language: python
    registry: pypi
