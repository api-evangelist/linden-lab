currency: USD
note: >-
  Second Life is priced as a consumer subscription plus a land-rental meter, not as
  an API product. There is no developer plan, no per-call pricing and no paid API
  tier anywhere on Linden Lab's surface: the Live Data Feeds are free and
  anonymous, an api-key for get_agent_id is free with any account, and Registration
  API access is granted by application at no stated charge. The tiers below are
  what a Second Life resident buys, recorded because they are the only published
  price list the company has and they gate the land quota an API consumer's users
  will hit. Prices are quoted "as low as", i.e. the annual-billing rate; the site
  does not publish the monthly-billing rate separately.
