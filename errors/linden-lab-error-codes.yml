note: 'Linden Lab publishes no application/problem+json and no OpenAPI, so nothing here is derived from
  a spec — the Registration API catalog below is transcribed from the wiki page that publishes it, and
  the get_agent_id envelope was observed on a live response. The two APIs use different, incompatible
  error shapes: Registration returns a numeric code that the API itself will enumerate for you via its
  get_error_codes capability, while get_agent_id returns a string `error` slug plus a human `message`.
  There is no shared error envelope across the Second Life API surface.'
